# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# Create it once: Render Dashboard → New → Blueprint → pick this repo. Later pushes to main redeploy.
services:
  - type: web
    name: onthec-api
    runtime: node
    plan: free # sleeps after ~15 min idle; first request then takes ~30-60 s. Upgrade before launch.
    region: singapore
    branch: main
    # Dev dependencies (prisma, tsup) are needed to build, so install them despite NODE_ENV=production.
    buildCommand: NODE_ENV=development npx --yes pnpm@10.12.4 install --frozen-lockfile && npx --yes pnpm@10.12.4 --filter api build
    # Apply pending migrations (uses DIRECT_URL), then start the bundled server.
    startCommand: cd apps/api && ./node_modules/.bin/prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      # The app is served from the Worker; /api is proxied there, so this only matters for direct calls.
      - key: WEB_ORIGINS
        value: https://gym-app.snitin322.workers.dev
      # Production secrets are generated by Render (different from local .env ones).
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      # Entered in the Render dashboard when the Blueprint is created (never committed):
      - key: DATABASE_URL # Neon Singapore, pooled
        sync: false
      - key: DIRECT_URL # Neon Singapore, direct (for migrations)
        sync: false
      - key: OTP_PROVIDER # "console" (codes in Render logs) until the WhatsApp template is approved, then "whatsapp"
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN # use a permanent System User token here
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        value: login_code
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en
